<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Afklaringer og modeltyper</title>
  <rect width="900" height="380" fill="#F5F1E6"/>


  <!-- Modeller -->
  <rect x="60" y="190" width="240" height="60" rx="4" fill="none" stroke="#3F1A2B" stroke-width="2" />
  <text x="180" y="226" font-size="17" font-weight="700" fill="#3F1A2B" text-anchor="middle">Begrebsmodel</text>

  <rect x="330" y="120" width="240" height="60" rx="4" fill="none" stroke="#3F1A2B" stroke-width="2" />
  <text x="450" y="156" font-size="17" font-weight="700" fill="#3F1A2B" text-anchor="middle">Informationsmodel</text>

  <rect x="600" y="50" width="240" height="60" rx="4" fill="none" stroke="#3F1A2B" stroke-width="2"/>
  <text x="720" y="86" font-size="17" font-weight="700" fill="#3F1A2B" text-anchor="middle">Logisk datamodel</text>

  <!-- Afklaringer -->
  <rect x="600" y="120" width="240" height="60" rx="4" fill="#514860"/>
  <text x="620" y="146" font-size="17" font-weight="700" fill="#F5F1E6">Datateknisk afklaring</text>
  <text x="620" y="167" font-size="13" fill="#F5F1E6">datatyper og associationsender</text>

  <rect x="330" y="190" width="510" height="60" rx="4" fill="#AB2A0C"/>
  <text x="350" y="216" font-size="17" font-weight="700" fill="#F5F1E6">Forretningsafklaring</text>
  <text x="350" y="237" font-size="13" fill="#F5F1E6">sammenhænge og begrænsinger baseret på forretningslogik</text>

  <rect x="60" y="260" width="780" height="60" rx="4" fill="#3F1A2B"/>
  <text x="80" y="286" font-size="17" font-weight="700" fill="#F5F1E6">Begrebsafklaring</text>
  <text x="80" y="307" font-size="13" fill="#F5F1E6">fælles termer og definitioner</text>


</svg>